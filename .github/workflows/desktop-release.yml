name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.0-codex.1)"
        required: true
      prerelease:
        description: "Mark release as prerelease"
        required: true
        default: "true"
  push:
    tags:
      - "codex-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_args: "--mac --publish never"
          - os: windows-latest
            build_args: "--win --x64 --publish never"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            newIDE/app/package-lock.json
            newIDE/electron-app/package-lock.json
            GDJS/package-lock.json

      - name: Install app dependencies
        run: npm ci
        working-directory: newIDE/app

      - name: Install electron dependencies
        run: npm ci
        working-directory: newIDE/electron-app

      - name: Build desktop packages
        run: npx electron-builder ${{ matrix.build_args }} --config electron-builder-config.js
        working-directory: newIDE/electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: newIDE/electron-app/dist/**
          if-no-files-found: error

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="codex-v${VERSION}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#codex-v}"
            PRERELEASE="true"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Codex Build ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*
